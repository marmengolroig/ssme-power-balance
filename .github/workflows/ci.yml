name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Verification & validation suite
        run: pytest
      - name: Validation summary
        run: python -m ssme --format summary

  coolprop-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with CoolProp
        run: pip install -e ".[dev,coolprop]"
      - name: Cross-check NIST tables against CoolProp
        run: pytest -m coolprop -v
      - name: Validation report with the CoolProp backend
        run: python -m ssme --backend coolprop --format summary
