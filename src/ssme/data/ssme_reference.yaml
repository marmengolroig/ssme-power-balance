# SSME reference operating point used by the assignment.
#
# All numbers were transcribed from the original MATLAB scripts (legacy/matlab/original/main.m and
# mainLOX.m). Where the scripts contained an obvious typo, the corrected value is used here and the
# original value is recorded under `data_issues` at the bottom of the file.
#
# Units: P [bar], T [K], m_dot [kg/s], rho [kg/m^3], W and Q [kW], v [m/s].
# `fluid`: H2 (hydrogen; the model chooses para or normal H2), O2, or gas (ideal-gas mixture).
# Values that are model *inputs* and values that are *reference results* are both listed; which
# is which depends on the run mode (see ssme/cycle.py).

meta:
  title: SSME power balance - reference stations
  source: "Assignment data (20250113_SSME_Assignment), station/component numbering as in the original scripts"
  hydrogen_table: pH2   # pH2 = para-hydrogen (default, see docs), H2 = normal hydrogen

stations:
  # ------------------------------------------------------------------ fuel (hydrogen) side
