  K25:  {type: pump,    inlet: S31, outlet: S32, eta: 0.650, W_ref: 2755.0,  note: LPFP}
  K26:  {type: pump,    inlet: S32, outlet: S33, eta: 0.730, W_ref: 59790.0, note: HPFP}
  K64:  {type: valve,   inlet: S33, outlet: S58, note: "main fuel valve (+ ducts)"}
  K28:  {type: hx,      inlet: S87, outlet: S36, Q: 93130.0, PR: 1.074, note: "nozzle coolant circuit (heat from K53)"}
  K36:  {type: valve,   inlet: S88, outlet: S89, note: "coolant control valve"}
  K37:  {type: mixer,   inlets: [S36, S89], outlet: S90}
  MCCJ: {type: hx,      inlet: S41, outlet: S43, Q: 47770.0, note: "MCC coolant jacket (heat from K52); not modelled in the original scripts"}
  K34:  {type: turbine, inlet: S43, outlet: S44, eta: 0.520, W_ref: -2755.0, note: LPFT}
  K38:  {type: valve,   inlet: S39, outlet: S40, PR: 1.114, note: "OPB fuel valve"}
  K45:  {type: burner,  inlets: [S38, S24], outlet: S55, note: "fuel preburner (FPB)"}
  HPFT: {type: gas_turbine, inlet: S55, outlet: S56, W_ref: -59790.0, note: "HP fuel turbine (not modelled in the original scripts); W_ref from the HPFTP shaft balance"}
  K49:  {type: gas_mixer, inlets: [S56, S72], outlet: S59}
  K40:  {type: burner,  inlets: [S40, S23], outlet: S50, note: "oxidizer preburner (OPB)"}
  K41:  {type: gas_turbine, inlet: S50, outlet: S51, eta: 0.780, W_ref: -21770.0, note: HPOT}
  K48:  {type: gas_mixer, inlets: [S53, S71], outlet: S54}
  K50:  {type: burner,  inlets: [S59, S54, S79, S18], outlet: S63, note: "main combustion chamber"}
  K52:  {type: heat,    Q: 47770.0, note: "heat to the MCC coolant (taken from the chamber gas)"}
  K53:  {type: heat,    Q: 93130.0, note: "heat to the nozzle coolant (taken from the nozzle gas)"}
  NOZ:  {type: nozzle,  inlet: S63, outlet: S68}
  # oxidizer side
  K10:  {type: pump,    inlet: S11, outlet: S12, eta: 0.630, W_ref: 1396.0,  note: LPOP}
  K12:  {type: mixer,   inlets: [S12, S162], outlet: S13}
  K13:  {type: pump,    inlet: S13, outlet: S14, eta: 0.670, W_ref: 20510.0, note: HPOP}
  K15:  {type: turbine, inlet: S15, outlet: S160, eta: 0.620, W_ref: -1396.0, note: "LPOT (hydraulic)"}
  K18:  {type: pump,    inlet: S20, outlet: S21, eta: 0.800, W_ref: 1263.0,  note: "preburner boost pump"}
  K67:  {type: hx,      inlet: S74, outlet: S80, Q: 405.1, PR: 1.157, note: "oxidizer heat exchanger (GOX pressurant)"}
  K70:  {type: valve,   inlet: S80, outlet: S69, note: "pressurant valve (2.49 bar outlet)"}
  K61:  {type: valve,   inlet: S22, outlet: S26, PR: 1.182}
  K20:  {type: valve,   inlet: S26, outlet: S23, PR: 1.221}

shafts:
  LPFTP: {pumps: [K25], turbines: [K34]}
  HPFTP: {pumps: [K26], turbines: [HPFT]}
  LPOTP: {pumps: [K10], turbines: [K15]}
  HPOTP: {pumps: [K13, K18], turbines: [K41]}

# Proposed acceptance criteria for the validation checks (edit to suit the assignment).
acceptance:
  T_abs_cryogenic: 2.0     # K, for reference temperatures below 200 K
  T_rel: 0.01              # relative, for reference temperatures >= 200 K
  W_rel: 0.03              # relative, pump/turbine power
  P_rel: 0.005             # relative, pressures computed from pressure ratios
  rho_rel: 0.005           # relative, densities from the property model
  v_rel: 0.01              # nozzle exit velocity
  M_rel: 0.02              # nozzle exit Mach number
  m_dot_abs: 0.02          # kg/s, mass-balance residuals (data are given to 0.01 kg/s)

data_issues:
  - {where: "S21.m_dot", original: 50.16, used: 50.46, reason: "S20 = 50.46 feeds K18, and S22 + S24 = 13.56 + 36.89 = 50.45"}
  - {where: "S40.m_dot", original: 19.34, used: 19.94, reason: "S39 = 19.94 feeds K38, and S51 = 33.50 = 19.94 + 13.56"}
  - {where: "S90.rho",   original: 30.97, used: null,  reason: "copied from S36; para-H2 at 431.4 bar / 163.3 K has rho ~ 43.7 kg/m^3"}
  - {where: "S71.rho, S72.rho", original: 21.76, used: null, reason: "copied from S44 (261.36 bar); para-H2 at 248.21 bar / 244.8 K has rho ~ 20.85 kg/m^3"}
  - {where: "HPFT.W_ref", original: null, used: -59790.0, reason: "not in the scripts; taken from the HPFTP shaft balance (= -K26.W_ref), so it inherits K26's inconsistency"}
  - {where: "K26.W_ref",  original: 59790.0, used: 59790.0, reason: "3.3 % larger than m*dh between the reference states S32 and S33 (57.8 MW); possibly includes mechanical losses"}
  - {where: "S162.rho",  original: 1056.87, used: 1056.78, reason: "S162 defined twice with two different densities; S160 also uses 1056.78"}
  - {where: "K70 'deltaP' = 1.991", original: 1.991, used: "P_out = 2.49 bar", reason: "1.991 was tuned so that P_in*(2-1.991) ~ 2.49 bar; as a true ratio it is 285.53/2.49 = 114.7"}
