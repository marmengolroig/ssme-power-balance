<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSME cycle map</title>
<meta name="description" content="Interactive map of the Space Shuttle Main Engine power-balance model and its validation checks, generated by the ssme-cycle package.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #E9EEF0;
  --sheet: #F7F9FA;
  --ink: #18212B;
  --muted: #5A6774;
  --rule: #CAD3D9;
  --grid: #E1E8EB;
  --fuel: #0E8A73;
  --ox: #2E59C2;
  --pbgas: #D97D12;
  --mccgas: #B4441A;
  --fail: #D2343E;
  --fail-soft: #F8DFE1;
  --focus: #2E59C2;
  --sans: "Barlow", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --narrow: "Barlow Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", "Barlow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E151B; --sheet: #141E26; --ink: #E2E9ED; --muted: #94A3AF; --rule: #2B3944; --grid: #1A2630;
    --fuel: #36C3A3; --ox: #7F9EF6; --pbgas: #F0A54C; --mccgas: #E87C4C; --fail: #FF5C66; --fail-soft: #3A1D22;
    --focus: #7F9EF6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E151B; --sheet: #141E26; --ink: #E2E9ED; --muted: #94A3AF; --rule: #2B3944; --grid: #1A2630;
  --fuel: #36C3A3; --ox: #7F9EF6; --pbgas: #F0A54C; --mccgas: #E87C4C; --fail: #FF5C66; --fail-soft: #3A1D22;
  --focus: #7F9EF6; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.5 var(--sans); font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 24px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: end; justify-content: space-between; padding: 28px 0 18px; }
h1 { font: 600 40px/1.05 var(--narrow); letter-spacing: -0.01em; margin: 0; }
.lede { margin: 8px 0 0; max-width: 62ch; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; background: var(--sheet); }
.seg button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer;
  font-weight: 500; font-size: 15px; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; padding: 12px 0 16px; border-top: 1px solid var(--rule); }
.summary .what { font-weight: 600; }
.summary .n { font: 600 22px/1 var(--narrow); margin-right: 4px; }
.summary .fail .n { color: var(--fail); }
.summary .explain { color: var(--muted); flex-basis: 100%; font-size: 15px; max-width: 90ch; }

/* map + panel */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.mapframe {
  background-color: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px;
}
#map { display: block; width: 100%; min-width: 980px; height: auto; }
.hint { display: none; margin: 6px 2px 0; font-size: 14px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 10px 2px 0; font-size: 14px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend svg { overflow: visible; }

/* svg */
.edge-halo { fill: none; stroke: var(--sheet); stroke-linejoin: round; stroke-linecap: butt; }
.edge { fill: none; stroke-linejoin: round; stroke-linecap: butt; cursor: pointer; }
.edge.fuel { stroke: var(--fuel); } .edge.ox { stroke: var(--ox); } .edge.pbgas { stroke: var(--pbgas); } .edge.mccgas { stroke: var(--mccgas); }
.edge.nm { stroke-dasharray: 6 4; }
.flow { fill: none; stroke: var(--sheet); stroke-dasharray: 2 10; stroke-linecap: round; opacity: 0; pointer-events: none; }
.edge-g.selected .flow { opacity: .9; animation: flow 0.9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.edge-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.slabel { font: 600 11.5px var(--narrow); fill: var(--muted); cursor: pointer; paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.slabel.fail { fill: var(--fail); }
.slabel.has { fill: var(--ink); }
.edge-g.selected .slabel { fill: var(--ink); text-decoration: underline; }
.node { cursor: pointer; }
.node .body { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.node .glyph { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.node .dot { fill: var(--ink); stroke: none; }
.node .tag { font: 600 12.5px var(--narrow); fill: var(--ink); paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.node .tag.inside { stroke: none; font-size: 13.5px; }
.node.fail .body { stroke: var(--fail); stroke-width: 2.6; fill: var(--fail-soft); }
.node.fail .tag { fill: var(--fail); }
.node .badge { display: none; }
.node.fail .badge { display: inline; }
.node .badge circle { fill: var(--fail); }
.node .badge text { font: 700 11px var(--sans); fill: #fff; text-anchor: middle; }
.node.absent { opacity: .38; }
.node.absent .body { stroke-dasharray: 3 3; }
.node.imposed .body { stroke-dasharray: 5 2.5; stroke-width: 2; }
.node.partner .body { stroke-width: 2.6; stroke: var(--focus); }
.node .ring { fill: none; stroke: var(--focus); stroke-width: 2; opacity: 0; }
.node.selected .ring, .node:focus-visible .ring { opacity: 1; }
.node:focus { outline: none; }
.edge-g:focus { outline: none; }
.edge-g:focus-visible .slabel { fill: var(--focus); text-decoration: underline; }

/* panel */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 18px 20px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.panel h2 { font: 600 26px/1.1 var(--narrow); margin: 0; }
.panel .sub { margin: 4px 0 12px; color: var(--muted); font-size: 15px; }
.panel h3 { font: 600 17px/1.2 var(--narrow); margin: 18px 0 8px; }
.panel p { margin: 8px 0; font-size: 15px; }
.params { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; font-size: 15px; }
.params div { display: flex; gap: 6px; }
.params dt { color: var(--muted); } .params dd { margin: 0; font-weight: 500; }
.chk { border-top: 1px solid var(--rule); padding: 10px 0 8px; }
.chk-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.chk-q { font-weight: 600; }
.pill { font: 600 13px/1 var(--narrow); padding: 3px 7px 4px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.pill.fail { background: var(--fail); border-color: var(--fail); color: #fff; }
.pill.pass { color: var(--ink); }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 10px; margin-top: 6px; font-size: 14px; }
.trio .k { color: var(--muted); font-size: 13px; }
.trio .v { font-weight: 500; }
.trio .v.dim { color: var(--muted); font-weight: 400; }
.trio .on .k { color: var(--ink); font-weight: 600; }
.chk-note { color: var(--muted); font-size: 14px; margin-top: 4px; }
.err { font-size: 14px; margin-top: 4px; }
.err.fail { color: var(--fail); font-weight: 600; }
.statetab { width: 100%; border-collapse: collapse; font-size: 15px; }
.statetab th, .statetab td { text-align: right; padding: 5px 0 5px 8px; border-bottom: 1px solid var(--rule); }
.statetab th { color: var(--muted); font-weight: 500; font-size: 13px; }
.statetab th:first-child, .statetab td:first-child { text-align: left; padding-left: 0; }
.comp { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
.linklist { list-style: none; padding: 0; margin: 6px 0 0; }
.linklist li { border-top: 1px solid var(--rule); }
.linklist button { display: flex; width: 100%; justify-content: space-between; gap: 10px; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; font-size: 15px; }
.linklist button:hover .t { text-decoration: underline; }
.linklist .v { color: var(--fail); font-weight: 600; white-space: nowrap; }
.issue { font-size: 14px; color: var(--muted); border-left: 3px solid var(--rule); padding: 2px 0 2px 10px; margin: 8px 0; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 14px; margin-bottom: 8px; }
.back:hover { color: var(--ink); text-decoration: underline; }

/* table */
.checks { margin: 34px 0 0; }
.checks-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; }
.checks h2 { font: 600 28px/1.1 var(--narrow); margin: 0; }
.tablewrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
table.all { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 15px; }
table.all th, table.all td { padding: 7px 12px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: top; }
table.all th { font-weight: 600; font-size: 14px; color: var(--muted); position: sticky; top: 0; background: var(--sheet); }
table.all td.l, table.all th.l { text-align: left; }
table.all tr.grp td { background: var(--paper); font: 600 16px var(--narrow); text-align: left; padding-top: 10px; }
table.all tbody tr.row { cursor: pointer; }
table.all tbody tr.row:hover td { background: var(--paper); }
table.all tr.row.fail td.st { color: var(--fail); font-weight: 600; }
table.all td.crit { color: var(--muted); font-size: 14px; }
table.all td.dim { color: var(--muted); }
footer { margin: 34px 0 40px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
footer p { margin: 4px 0; max-width: 110ch; }
footer a { color: inherit; }

@media (max-width: 1100px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  .hint { display: block; }
}
@media (max-width: 600px) {
  .wrap { padding: 0 16px; }
  h1 { font-size: 32px; }
  .seg button { padding: 6px 11px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .edge-g.selected .flow { animation: none; opacity: .9; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>SSME cycle map</h1>
      <p class="lede">Space Shuttle Main Engine staged-combustion cycle at the reference operating point. Pipe width grows with mass flow. Select a component or a station to see its checks.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Run mode">
        <button type="button" data-mode="isolated" aria-pressed="true">Isolated components</button>
        <button type="button" data-mode="chained" aria-pressed="false">Chained cycle</button>
      </div>
      <div class="seg" role="group" aria-label="Values judged">
        <button type="button" data-view="model" aria-pressed="true">Python model</button>
        <button type="button" data-view="original" aria-pressed="false">Original MATLAB</button>
      </div>
    </div>
  </header>

  <section class="summary" id="summary" aria-live="polite"></section>

  <main class="stage">
    <div>
      <div class="mapframe"><svg id="map" role="group" aria-label="Cycle schematic"></svg></div>
      <p class="hint">Scroll the map sideways to see the whole cycle.</p>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section class="checks" aria-labelledby="checks-title">
    <div class="checks-head">
      <h2 id="checks-title">Checks</h2>
      <div class="seg" role="group" aria-label="Rows shown">
        <button type="button" data-filter="failed" aria-pressed="true">Failed</button>
        <button type="button" data-filter="all" aria-pressed="false">All</button>
      </div>
    </div>
    <div class="tablewrap"><table class="all" id="table"></table></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
const DATA = /*__SSME_DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
const state = { mode: "isolated", view: "model", sel: null, filter: "failed" };
const MODE_NAME = { isolated: "Isolated components", chained: "Chained cycle" };
const GROUPS = {
  component: "Components", system: "System", balance: "Mass and shaft-power balances",
  data: "Reference-data consistency", property: "Property model against reference densities",
  info: "Additional results (no criterion)"
};
const KIND = { fuel: "Hydrogen", ox: "Oxygen", pbgas: "Preburner gas (H2 and steam)", mccgas: "Chamber gas" };

/* ---------- formatting ---------- */
function fmt(x) {
  if (x === null || x === undefined || Number.isNaN(x)) return "–";
  const a = Math.abs(x);
  if (a !== 0 && a < 0.01) return x.toExponential(2);
  if (a >= 1e5) return Math.round(x).toLocaleString("en-US");
  if (a >= 1000) return x.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  if (a < 10) return x.toFixed(3);
  return x.toFixed(2);
}
function withUnit(x, u) { const s = fmt(x); return (s === "–" || !u || u === "-") ? s : s + " " + u; }
function pct(r) { return (r === null || r === undefined) ? "" : (r >= 0 ? "+" : "−") + Math.abs(100 * r).toFixed(2) + " %"; }
function signed(x, u) { if (x === null || x === undefined) return ""; return (x >= 0 ? "+" : "−") + withUnit(Math.abs(x), u); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- status ---------- */
function checks() { return DATA.modes[state.mode].checks; }
function verdict(c) {  // pass | fail | info | imposed | absent | none (for the active view)
  if (state.view === "model") return c.passed === true ? "pass" : c.passed === false ? "fail" : "info";
  const o = c.original;
  if (!o) return "none";
  if (o.status === "imposed") return "imposed";
  if (o.status === "not_modelled") return "absent";
  return o.passed === true ? "pass" : o.passed === false ? "fail" : "info";
}
function statusOf(id) {
  const vs = checks().filter(c => c.targets.includes(id)).map(verdict).filter(v => v !== "none");
  for (const s of ["fail", "imposed", "absent", "pass", "info"]) {
    if (s === "absent" && vs.length && vs.every(v => v === "absent")) return "absent";
    if (s !== "absent" && vs.includes(s)) return s;
  }
  return "none";
}

/* ---------- drawing ---------- */
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function pathD(pts) { return pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" "); }
const SIZE = { pump: 15, turbine: 15, gasturbine: 17, valve: 11, hx: 13, mixer: 8, split: 5, burner: 17, chamber: 30,
               nozzle: 22, duct: 7, manifold: 13, source: 17, sink: 10 };

function drawShape(g, type, x, y) {
  switch (type) {
    case "pump":
      el("circle", { cx: x, cy: y, r: 15, class: "body" }, g);
      el("path", { d: `M${x - 5} ${y - 7} L${x + 6} ${y} L${x - 5} ${y + 7}`, class: "glyph" }, g);
      return 19;
    case "turbine":
    case "gasturbine": {
      const s = type === "gasturbine" ? 1.2 : 1;
      el("path", { d: `M${x - 14 * s} ${y - 8 * s} L${x + 14 * s} ${y - 16 * s} L${x + 14 * s} ${y + 16 * s} L${x - 14 * s} ${y + 8 * s} Z`, class: "body" }, g);
      return 20 * s;
    }
    case "valve":
      el("path", { d: `M${x - 12} ${y - 9} L${x + 12} ${y + 9} L${x + 12} ${y - 9} L${x - 12} ${y + 9} Z`, class: "body" }, g);
      return 14;
    case "hx":
      el("rect", { x: x - 19, y: y - 12, width: 38, height: 24, rx: 3, class: "body" }, g);
      el("path", { d: `M${x - 13} ${y + 4} L${x - 7} ${y - 5} L${x - 1} ${y + 4} L${x + 5} ${y - 5} L${x + 11} ${y + 4}`, class: "glyph" }, g);
      return 16;
    case "mixer":
      el("circle", { cx: x, cy: y, r: 8, class: "body" }, g);
      el("circle", { cx: x, cy: y, r: 2.6, class: "dot" }, g);
      return 12;
    case "split":
      el("circle", { cx: x, cy: y, r: 5, class: "dot" }, g);
      return 9;
    case "burner":
      el("rect", { x: x - 25, y: y - 17, width: 50, height: 34, rx: 8, class: "body" }, g);
      return 21;
    case "chamber":
      el("rect", { x: x - 26, y: y - 34, width: 52, height: 68, rx: 10, class: "body" }, g);
      return 38;
    case "nozzle":
      el("path", { d: `M${x - 18} ${y - 12} L${x - 6} ${y - 6} Q${x + 8} ${y - 10} ${x + 20} ${y - 28} L${x + 20} ${y + 28} Q${x + 8} ${y + 10} ${x - 6} ${y + 6} L${x - 18} ${y + 12} Z`, class: "body" }, g);
      return 32;
    case "duct":
      el("rect", { x: x - 8, y: y - 6, width: 16, height: 12, rx: 3, class: "body" }, g);
      return 10;
    case "manifold":
      el("rect", { x: x - 20, y: y - 13, width: 40, height: 26, rx: 13, class: "body", "stroke-dasharray": "4 3" }, g);
      return 17;
    case "source":
      el("rect", { x: x - 13, y: y - 19, width: 26, height: 38, rx: 12, class: "body" }, g);
      return 23;
    case "sink":
      el("path", { d: `M${x - 6} ${y - 9} L${x + 6} ${y} L${x - 6} ${y + 9}`, class: "glyph" }, g);
      return 12;
  }
  return 12;
}

function drawMap() {
  const svg = document.getElementById("map");
  const L = DATA.layout;
  svg.setAttribute("viewBox", L.viewBox.join(" "));
  const halos = el("g", {}, svg), edges = el("g", {}, svg), nodes = el("g", {}, svg), labels = el("g", {}, svg);
  for (const e of L.edges) {
    const d = pathD(e.points);
    el("path", { d, class: "edge-halo", "stroke-width": e.width + 5 }, halos);
    const g = el("g", { class: "edge-g", "data-id": e.id, tabindex: DATA.stations[e.id] ? 0 : -1, role: "button",
                         "aria-label": "Station " + e.id }, edges);
    el("path", { d, class: "edge " + e.kind + (e.not_modelled ? " nm" : ""), "stroke-width": e.width }, g);
    el("path", { d, class: "flow", "stroke-width": Math.max(1.2, e.width * 0.35) }, g);
    el("path", { d, class: "edge-hit" }, g);
    // label on the longest segment
    let best = 0, bi = 0;
    for (let i = 0; i < e.points.length - 1; i++) {
      const [a, b] = [e.points[i], e.points[i + 1]];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (len > best) { best = len; bi = i; }
    }
    const [a, b] = [e.points[bi], e.points[bi + 1]];
    const horiz = Math.abs(b[1] - a[1]) < Math.abs(b[0] - a[0]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, off = e.width / 2 + 5;
    const at = e.label ? { x: e.label[0], y: e.label[1], "text-anchor": e.label[2], class: "slabel" }
      : horiz ? { x: mx, y: my - off, "text-anchor": "middle", class: "slabel" }
              : { x: mx + off, y: my + 4, "text-anchor": "start", class: "slabel" };
    const t = el("text", at, g);
    t.textContent = e.id;
  }
  for (const [id, n] of Object.entries(L.nodes)) {
    const c = DATA.components[id];
    const g = el("g", { class: "node", "data-id": id, tabindex: 0, role: "button", "aria-label": c.name }, nodes);
    const r = drawShape(g, n.type, n.x, n.y);
    el("circle", { cx: n.x, cy: n.y, r: r + 5, class: "ring" }, g);
    const badge = el("g", { class: "badge" }, g);
    el("circle", { cx: n.x + r - 2, cy: n.y - r + 2, r: 7 }, badge);
    const bt = el("text", { x: n.x + r - 2, y: n.y - r + 6 }, badge); bt.textContent = "!";
    if (c.tag && c.tag_pos !== "none") {
      const pos = c.tag_pos, at = { x: n.x, y: n.y, "text-anchor": "middle", class: "tag" + (pos === "inside" ? " inside" : "") };
      if (pos === "below") at.y = n.y + r + 13;
      if (pos === "above") at.y = n.y - r - 6;
      if (pos === "inside") at.y = n.y + 5;
      if (pos === "left") { at.x = n.x - r - 6; at.y = n.y + 4; at["text-anchor"] = "end"; }
      if (pos === "right") { at.x = n.x + r + 6; at.y = n.y + 4; at["text-anchor"] = "start"; }
      el("text", at, g).textContent = c.tag;
    }
  }
  svg.addEventListener("click", ev => {
    const t = ev.target.closest("[data-id]");
    if (t) select(t.getAttribute("data-id"));
  });
  svg.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const t = ev.target.closest("[data-id]");
    if (t) { ev.preventDefault(); select(t.getAttribute("data-id")); }
  });
}

function drawLegend() {
  const lg = document.getElementById("legend");
  const sw = (cls, w, dash) => `<svg width="34" height="12" aria-hidden="true"><path d="M1 6 H33" class="edge ${cls}${dash ? " nm" : ""}" stroke-width="${w}"/></svg>`;
  lg.innerHTML =
    Object.entries(KIND).map(([k, v]) => `<span>${sw(k, 4)}${v}</span>`).join("") +
    `<span>${sw("ox", 1.3)}${sw("ox", 4.2)}${sw("ox", 11)} 0.5, 50 and 500 kg/s</span>` +
    `<span>${sw("fuel", 2.6, true)}Not computed: reference state used</span>`;
}

/* ---------- updates ---------- */
function refresh() {
  document.querySelectorAll("#map .node").forEach(g => {
    const id = g.getAttribute("data-id"), s = statusOf(id);
    g.classList.remove("fail", "pass", "info", "imposed", "absent", "none", "selected", "partner");
    g.classList.add(s);
    const c = DATA.components[id];
    const failing = s === "fail" ? ", has a failed check" : s === "absent" ? ", not modelled in the original scripts" :
                    s === "imposed" ? ", output imposed in the original scripts" : "";
    g.setAttribute("aria-label", c.name + failing);
  });
  document.querySelectorAll("#map .edge-g").forEach(g => {
    const id = g.getAttribute("data-id"), s = statusOf(id), lab = g.querySelector(".slabel");
    g.classList.remove("selected");
    lab.classList.toggle("fail", s === "fail");
    lab.classList.toggle("has", s === "pass" || s === "info");
  });
  if (state.sel) {
    const t = document.querySelector(`#map [data-id="${state.sel}"]`);
    if (t) t.classList.add("selected");
    const c = DATA.components[state.sel];
    if (c && c.shaft) {
      const sh = DATA.shafts[c.shaft];
      [...sh.pumps, ...sh.turbines].filter(k => k !== state.sel).forEach(k => {
        const p = document.querySelector(`#map .node[data-id="${k}"]`); if (p) p.classList.add("partner");
      });
    }
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === state.filter));
  renderSummary(); renderPanel(); renderTable();
}

function renderSummary() {
  const box = document.getElementById("summary");
  if (state.view === "model") {
    const s = DATA.modes[state.mode].summary;
    const explain = state.mode === "isolated"
      ? "Each component gets the reference inlet state, so every comparison validates one component model."
      : "Computed states are passed downstream: the LOX recirculation loop is iterated and the high-pressure fuel turbine is closed with its shaft power balance.";
    box.innerHTML = `<span class="what">${MODE_NAME[state.mode]}</span>
      <span><span class="n">${s.pass}</span>checks pass</span>
      <span class="fail"><span class="n">${s.fail}</span>fail</span>
      <span><span class="n">${s.info}</span>informative</span>
      <span class="explain">${explain}</span>`;
  } else {
    const s = DATA.meta.original_summary;
    box.innerHTML = `<span class="what">Original MATLAB scripts</span>
      <span><span class="n">${s.pass}</span>pass</span>
      <span class="fail"><span class="n">${s.fail}</span>fail</span>
      <span><span class="n">${s.imposed}</span>imposed instead of computed</span>
      <span><span class="n">${s.not_modelled}</span>not modelled</span>
      <span class="explain">The original logic (normal hydrogen, pressure ratios applied as P·(2−ΔP), the mass-flow typos, the HPOT as pure hydrogen…) re-run with the Python property layer and judged with the same criteria. MATLAB itself was not run.</span>`;
  }
}

function valueTrio(c) {
  const o = c.original;
  const on = state.view;
  const oval = !o ? "–" : o.status === "imposed" ? "set to reference" : o.status === "not_modelled" ? "not modelled" : withUnit(o.value, c.unit);
  return `<div class="trio">
    <div class="${on === "model" ? "on" : ""}"><div class="k">Python</div><div class="v">${withUnit(c.computed, c.unit)}</div></div>
    <div><div class="k">Reference</div><div class="v">${withUnit(c.reference, c.unit)}</div></div>
    <div class="${on === "original" ? "on" : ""}"><div class="k">Original</div><div class="v ${!o || o.status !== "computed" ? "dim" : ""}">${oval}</div></div>
  </div>`;
}
function checkBlock(c) {
  const v = verdict(c);
  const label = { pass: "Pass", fail: "Fail", info: "Info", imposed: "Imposed", absent: "Not modelled", none: "No original value" }[v];
  const src = state.view === "original" && c.original && c.original.status === "computed" ? c.original : c;
  const err = (src.error !== undefined && src.error !== null && c.reference !== null)
    ? `<div class="err ${v === "fail" ? "fail" : ""}">Error ${signed(src.error, c.unit)}${src.rel !== null && src.rel !== undefined ? " (" + pct(src.rel) + ")" : ""}${src.criterion && src.criterion !== "info" ? ", criterion " + esc(src.criterion) : ""}</div>` : "";
  const notes = [c.note, state.view === "original" && c.original ? c.original.note : ""].filter(Boolean);
  const head = ["balance", "data", "property"].includes(c.group) ? `${c.item}: ${c.quantity}` : c.quantity;
  return `<div class="chk"><div class="chk-head"><span class="chk-q">${esc(head)}</span><span class="pill ${v}">${label}</span></div>
    ${valueTrio(c)}${err}${notes.map(n => `<div class="chk-note">${esc(n)}</div>`).join("")}</div>`;
}
function relatedIssues(id) {
  return DATA.data_issues.filter(d => new RegExp("\\b" + id + "\\b").test(d.where))
    .map(d => `<div class="issue"><strong>${esc(d.where)}</strong>: ${esc(d.reason)}</div>`).join("");
}

function renderPanel() {
  const p = document.getElementById("panel");
  const id = state.sel;
  if (!id) { p.innerHTML = defaultPanel(); return; }
  const back = `<button class="back" type="button" data-clear>Back to the overview</button>`;
  const cs = checks().filter(c => c.targets.includes(id));
  if (DATA.components[id]) {
    const c = DATA.components[id];
    const pr = c.params, P = [];
    if (pr.eta !== undefined) P.push(["Efficiency", pr.eta.toFixed(3)]);
    if (pr.PR !== undefined) P.push(["Pressure ratio", pr.PR.toFixed(3)]);
    if (pr.Q !== undefined) P.push(["Heat", withUnit(pr.Q, "kW")]);
    if (pr.W_ref !== undefined) P.push(["Reference power", withUnit(pr.W_ref, "kW")]);
    if (c.shaft) P.push(["Shaft", c.shaft]);
    const params = P.length ? `<dl class="params">${P.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : "";
    const sub = [id, c.note && c.note !== c.name ? c.note : ""].filter(Boolean).join(", ");
    p.innerHTML = `${back}<h2>${esc(c.name)}</h2><p class="sub">${esc(sub)}</p>${params}
      ${cs.length ? `<h3>Checks</h3>${cs.map(checkBlock).join("")}` : `<p>${c.type === "split" || c.type === "mixer" ? "Only mass balances apply here." : "No checks are attached to this element."}</p>`}
      ${c.shaft ? `<p class="chk-note">Highlighted on the map: the other machines on the ${esc(c.shaft)} shaft.</p>` : ""}
      ${relatedIssues(id)}`;
    return;
  }
  const st = DATA.stations[id] || {};
  const s = (DATA.modes[state.mode].states || {})[id];
  const edge = DATA.layout.edges.find(e => e.id === id) || {};
  const rows = [["Pressure", "P", "bar"], ["Temperature", "T", "K"], ["Mass flow", "m_dot", "kg/s"], ["Density", "rho", "kg/m³"]];
  const of = DATA.meta.original_flows[id];
  const table = `<table class="statetab"><thead><tr><th>Quantity</th><th>Python</th><th>Reference</th></tr></thead><tbody>
    ${rows.map(([n, k, u]) => `<tr><td>${n}</td><td>${s ? withUnit(s[k], u) : "–"}</td><td>${withUnit(st[k], u)}</td></tr>`).join("")}
    </tbody></table>`;
  const comp = s && s.composition ? `<h3>Composition (mass fractions)</h3><div class="comp">${Object.entries(s.composition).slice(0, 6).map(([k, v]) => `<span>${esc(k)} ${(100 * v).toFixed(2)} %</span>`).join("")}</div>` : "";
  p.innerHTML = `${back}<h2>Station ${esc(id)}</h2><p class="sub">${esc(KIND[edge.kind] || "")}${st.note ? ", " + esc(st.note) : ""}</p>
    ${s ? "" : `<p class="chk-note">${MODE_NAME[state.mode]} mode does not compute this state; the reference values are inputs.</p>`}
    ${table}
    ${edge.not_modelled ? `<p class="chk-note">${esc(edge.not_modelled)}.</p>` : ""}
    ${of !== undefined ? `<p class="chk-note">The original scripts used ${fmt(of)} kg/s here (typo, see the data issues).</p>` : ""}
    ${comp}
    ${cs.length ? `<h3>Checks</h3>${cs.map(checkBlock).join("")}` : ""}
    ${relatedIssues(id)}`;
}

function defaultPanel() {
  const failed = checks().filter(c => verdict(c) === "fail");
  const title = state.view === "model" ? "Failed checks" : "Failed in the original scripts";
  const list = failed.map((c, i) => {
    const src = state.view === "original" ? c.original : c;
    return `<li><button type="button" data-jump="${c.targets[0]}"><span class="t">${esc(c.item)}: ${esc(c.quantity)}</span><span class="v">${pct(src.rel)}</span></button></li>`;
  }).join("");
  return `<h2>Overview</h2>
    <p>Select any component or station on the map. Red marks a failed check; in the original view, faded parts were not modelled and dashed outlines had their result imposed.</p>
    <h3>${title} (${failed.length})</h3><ul class="linklist">${list}</ul>
    ${state.view === "model" ? `<p class="chk-note">These deviations are known and explained in docs/CODE_REVIEW.md and docs/VV_PLAN.md.</p>` : ""}`;
}

function renderTable() {
  const t = document.getElementById("table");
  let cs = checks();
  if (state.filter === "failed") cs = cs.filter(c => verdict(c) === "fail");
  const head = `<thead><tr><th class="l">Status</th><th class="l">Item</th><th class="l">Quantity</th><th>Python</th><th>Reference</th><th>Original</th><th>Error</th><th class="l">Criterion</th></tr></thead>`;
  let body = "";
  for (const [g, title] of Object.entries(GROUPS)) {
    const rows = cs.filter(c => c.group === g);
    if (!rows.length) continue;
    body += `<tr class="grp"><td colspan="8">${title}</td></tr>`;
    for (const c of rows) {
      const v = verdict(c);
      const o = c.original;
      const oval = !o ? "" : o.status === "imposed" ? "imposed" : o.status === "not_modelled" ? "not modelled" : withUnit(o.value, c.unit);
      const src = state.view === "original" && o && o.status === "computed" ? o : c;
      const crit = state.view === "original" && o && o.criterion ? o.criterion : c.criterion;
      body += `<tr class="row ${v}" data-jump="${c.targets[0]}" tabindex="0"><td class="l st">${{ pass: "Pass", fail: "Fail", info: "Info", imposed: "Imposed", absent: "Not modelled", none: "" }[v]}</td>
        <td class="l">${esc(c.item)}</td><td class="l">${esc(c.quantity)}</td><td>${withUnit(c.computed, c.unit)}</td>
        <td>${withUnit(c.reference, c.unit)}</td><td class="${o && o.status === "computed" ? "" : "dim"}">${oval}</td>
        <td>${src.rel !== null && src.rel !== undefined ? pct(src.rel) : ""}</td><td class="l crit">${esc(crit === "info" ? "" : crit)}</td></tr>`;
    }
  }
  if (!body) body = `<tr><td class="l" colspan="8">No failed checks in this view. Choose All to see every check.</td></tr>`;
  t.innerHTML = head + "<tbody>" + body + "</tbody>";
}

function select(id) {
  if (id === "ENGINE") id = null;
  if (id === "S62") id = "K50";  // chamber station shown with the chamber
  state.sel = (id && (DATA.components[id] || DATA.stations[id] || DATA.layout.edges.some(e => e.id === id))) ? id : null;
  refresh();
}

function renderFooter() {
  const m = DATA.meta;
  document.getElementById("footer").innerHTML =
    `<p>Generated on ${esc(m.generated)} by ssme-cycle ${esc(m.version)} (<code>python -m ssme --format html</code>). Hydrogen: ${m.hydrogen === "pH2" ? "para" : "normal"}; real-fluid properties: ${m.backend === "nfp" ? "NIST tables" : "CoolProp"}; nozzle: ${esc(m.nozzle)} equilibrium.</p>
     <p>Thermodynamics ported from <a href="https://github.com/ManelSoria/HGS">HGS</a> (C. Fuster, M. Soria, A. Miró et al.) and <a href="https://github.com/ManelSoria/INIST">INIST</a> (M. Soria, C. Fuster, L. Frezza), ESEIAAT, Universitat Politècnica de Catalunya, with data from the Burcat database and the NIST Chemistry WebBook.</p>`;
}

/* ---------- wiring ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button, tr[data-jump]");
  if (!b) return;
  if (b.dataset.mode) { state.mode = b.dataset.mode; refresh(); }
  else if (b.dataset.view) { state.view = b.dataset.view; refresh(); }
  else if (b.dataset.filter) { state.filter = b.dataset.filter; refresh(); }
  else if (b.hasAttribute("data-clear")) { select(null); }
  else if (b.dataset.jump) {
    select(b.dataset.jump);
    if (b.tagName === "TR") document.querySelector(".stage").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
});
document.addEventListener("keydown", ev => {
  const r = ev.target.closest && ev.target.closest("tr[data-jump]");
  if (r && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); r.click(); }
  if (ev.key === "Escape" && state.sel) select(null);
});

drawMap(); drawLegend(); renderFooter(); refresh();
</script>
</body>
</html>
